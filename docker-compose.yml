services:
  backend:
    build:
      context: ./backend
    image: micrologis/backend:latest
    container_name: micrologis-backend
    restart: always
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      # Emplacement de la base SQLite (dossier monté pour persistance)
      - DB_PATH=/app/data/db.sqlite3
    volumes:
      # Mount persistent data files
      - ./backend/data:/app/data
      - ./backend/media:/app/media
      - ./backend/factures:/app/factures
      - ./backend/backup:/app/backup
      - ./backend/staticfiles:/app/staticfiles

  frontend:
    build:
      context: ./frontend
    image: micrologis/frontend:latest
    container_name: micrologis-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      # Mount media and factures as read-only so Nginx can serve them rapidly
      - ./backend/media:/app/media:ro
      - ./backend/factures:/app/factures:ro
      - ./backend/staticfiles:/app/staticfiles:ro
